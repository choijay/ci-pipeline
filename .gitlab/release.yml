# Python 대신 이미 사용하는 Gradle/JDK로 릴리스 JSON과 WAR를 검증합니다.
# include로 전달되는 코드입니다. 다른 저장소를 다운로드하지 않습니다.
.release_tasks:
  script:
    - |
      mkdir -p .ci-release
      printf "rootProject.name = 'release-tools'\n" > .ci-release/settings.gradle
      cat > .ci-release/build.gradle <<'GRADLE'
      import groovy.json.JsonOutput
      import groovy.json.JsonSlurper
      import java.security.MessageDigest
      import java.util.zip.ZipFile
      import java.util.zip.CRC32
      import java.time.Instant

      def required = { key ->
          def value = System.getenv(key)
          if (!value) throw new GradleException('Missing CI variable: ' + key)
          value
      }
      def app = new File(required('CI_PROJECT_DIR'))
      def token = { value ->
          if (!(value instanceof String) || !(value ==~ /[A-Za-z0-9_][A-Za-z0-9_.-]*/) || value.contains('..'))
              throw new GradleException('Invalid release coordinate')
          value
      }
      def sha256 = { File file ->
          def digest = MessageDigest.getInstance('SHA-256')
          file.withInputStream { input ->
              byte[] buffer = new byte[65536]
              int size
              while ((size = input.read(buffer)) != -1) digest.update(buffer, 0, size)
          }
          digest.digest().encodeHex().toString()
      }
      def validateWar = { File file ->
          boolean webInf = false
          new ZipFile(file).withCloseable { zip ->
              zip.entries().each { entry ->
                  webInf |= entry.name.startsWith('WEB-INF/')
                  def crc = new CRC32()
                  zip.getInputStream(entry).withCloseable { input ->
                      byte[] buffer = new byte[65536]
                      int size
                      while ((size = input.read(buffer)) != -1) crc.update(buffer, 0, size)
                  }
                  if (crc.value != entry.crc) throw new GradleException('Corrupt WAR entry')
              }
          }
          if (!webInf) throw new GradleException('WAR has no WEB-INF entries')
      }
      def readManifest = { File file ->
          def data = new JsonSlurper().parse(file, 'UTF-8')
          if (!(data instanceof Map) || data.schemaVersion != 1 || data.branch != 'develop')
              throw new GradleException('Invalid release manifest')
          ['groupId', 'artifactId', 'version'].each { token(data[it]) }
          if (!(data.sha256 ==~ /[0-9a-f]{64}/) || !(data.commitSha ==~ /[0-9a-f]{40,64}/))
              throw new GradleException('Invalid manifest checksum/commit')
          data
      }
      def writeJson = { File file, data ->
          file.parentFile.mkdirs()
          file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(data)) + '\n', 'UTF-8')
      }
      def localManifest = {
          def data = readManifest(new File(app, 'dist/release.json'))
          def war = new File(app, 'dist/application.war')
          validateWar(war)
          if (sha256(war) != data.sha256) throw new GradleException('WAR checksum mismatch')
          if (data.projectId != required('CI_PROJECT_ID') || data.commitSha != required('CI_COMMIT_SHA'))
              throw new GradleException('Release project/commit mismatch')
          data
      }
      def coordinates = { group, artifact, version ->
          [group, artifact, version].each { token(it) }
          if (version.toLowerCase() in ['latest', 'release'] || version.toLowerCase().contains('snapshot'))
              throw new GradleException('Immutable release version required')
          def raw = required('NEXUS_REPOSITORY_URL').replaceAll('/+$', '')
          def uri = new URI(raw)
          if (!uri.host || uri.userInfo || uri.query || uri.fragment ||
              !(uri.scheme == 'https' || (uri.scheme == 'http' && uri.host in ['127.0.0.1', 'localhost', '[::1]', '::1'])))
              throw new GradleException('Nexus requires HTTPS or same-VM loopback HTTP')
          raw + '/' + group.replace('.', '/') + '/' + artifact + '/' + version + '/' + artifact + '-' + version
      }
      def download = { String url, File target, long limit ->
          def user = required('NEXUS_READ_USERNAME')
          if (user.contains(':') || user.contains('\n') || user.contains('\r'))
              throw new GradleException('Invalid Nexus username')
          def auth = (user + ':' + required('NEXUS_READ_PASSWORD')).getBytes('UTF-8').encodeBase64().toString()
          HttpURLConnection connection = (HttpURLConnection) new URL(url).openConnection()
          connection.instanceFollowRedirects = false
          connection.connectTimeout = 15000
          connection.readTimeout = 60000
          connection.setRequestProperty('Authorization', 'Basic ' + auth)
          try {
              if (connection.responseCode != 200) throw new GradleException('Nexus HTTP ' + connection.responseCode)
              connection.inputStream.withCloseable { input ->
                  target.withOutputStream { output ->
                      byte[] buffer = new byte[65536]
                      long total = 0
                      int size
                      while ((size = input.read(buffer)) != -1) {
                          total += size
                          if (total > limit) throw new GradleException('Nexus response exceeds size limit')
                          output.write(buffer, 0, size)
                      }
                  }
              }
          } finally { connection.disconnect() }
      }
      tasks.register('createRelease') {
          doLast {
              if ([required('CI_PIPELINE_SOURCE'), required('CI_COMMIT_BRANCH'), required('CI_COMMIT_REF_PROTECTED')] != ['push', 'develop', 'true'])
                  throw new GradleException('Protected develop push required')
              def pipeline = required('CI_PIPELINE_ID')
              def job = required('CI_JOB_ID')
              if (!(pipeline ==~ /[0-9]+/) || !(job ==~ /[0-9]+/)) throw new GradleException('Numeric IDs required')
              def war = new File(app, 'dist/application.war')
              validateWar(war)
              def data = [schemaVersion: 1, branch: 'develop',
                  groupId: token(required('MAVEN_GROUP_ID')), artifactId: token(required('MAVEN_ARTIFACT_ID')),
                  version: token(new File(app, 'dist/version.txt').getText('UTF-8').trim() + '-build.' + job),
                  sha256: sha256(war), commitSha: required('CI_COMMIT_SHA'),
                  projectId: required('CI_PROJECT_ID'), pipelineId: pipeline, packageJobId: job,
                  createdAt: Instant.now().toString()]
              if (!(data.commitSha ==~ /[0-9a-f]{40,64}/)) throw new GradleException('Invalid commit SHA')
              writeJson(new File(app, 'dist/release.json'), data)
              println('RELEASE_VERSION=' + data.version)
              println('RELEASE_SHA256=' + data.sha256)
          }
      }
      tasks.register('verifyLocal') { doLast { localManifest() } }
      tasks.register('fetchRelease') {
          doLast {
              def version = required('DEPLOY_VERSION')
              def expected = required('DEPLOY_SHA256').toLowerCase()
              if (!(expected ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid DEPLOY_SHA256')
              def group = required('MAVEN_GROUP_ID')
              def artifact = required('MAVEN_ARTIFACT_ID')
              def path = coordinates(group, artifact, version)
              def meta = new File(temporaryDir, 'release.json')
              def war = new File(temporaryDir, 'application.war')
              download(path + '-manifest.json', meta, 1024L * 1024)
              def data = readManifest(meta)
              if ([data.groupId, data.artifactId, data.version, data.projectId, data.sha256] !=
                  [group, artifact, version, required('CI_PROJECT_ID'), expected])
                  throw new GradleException('Deployment coordinates/project/checksum mismatch')
              download(path + '.war', war, 2L * 1024 * 1024 * 1024)
              if (sha256(war) != expected) throw new GradleException('Downloaded WAR checksum mismatch')
              validateWar(war)
              copy { from(war, meta); into(new File(app, 'deploy')) }
          }
      }
      GRADLE
